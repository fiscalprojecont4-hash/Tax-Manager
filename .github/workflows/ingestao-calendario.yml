name: Ingestão do calendário oficial

# Lê a Agenda Tributária da Receita Federal e da SEFAZ-AM (API pública do portal) e grava RASCUNHOS no Supabase.
# Nada vai para o calendário dos usuários sem aprovação do gestor fiscal.
# Requer os Secrets SUPABASE_URL e SUPABASE_SERVICE_KEY (Settings > Secrets and variables > Actions).
on:
  schedule:
    - cron: '0 9 * * *'   # todo dia, 06:00 em Brasília
  workflow_dispatch:
    inputs:
      ano: { description: 'Ano (opcional)', required: false }
      mes: { description: 'Mês 1-12 (opcional)', required: false }

permissions:
  contents: read

jobs:
  ingestao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Testes dos parsers
        run: |
          node scripts/ingestao-receita.test.mjs
          node scripts/ingestao-sefaz-am.test.mjs
      - name: Mês informado
        if: ${{ inputs.mes != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/ingestao-receita.mjs --ano "${{ inputs.ano || '' }}" --mes "${{ inputs.mes }}" --enviar
      - name: SEFAZ-AM (mês informado)
        if: ${{ inputs.mes != '' }}
        continue-on-error: true   # uma fonte fora do ar não derruba a outra
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/ingestao-sefaz-am.mjs --mes "${{ inputs.mes }}" --enviar
      - name: SEFAZ-AM (mês atual e próximo)
        if: ${{ inputs.mes == '' }}
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/ingestao-sefaz-am.mjs --enviar
          # A API só serve o ano corrente: em dezembro não há "próximo mês" a buscar.
          m=$(date +%-m)
          if [ "$m" -lt 12 ]; then node scripts/ingestao-sefaz-am.mjs --mes $((m+1)) --enviar || echo "Mês seguinte da SEFAZ-AM ainda sem obrigações."; fi
      - name: Receita Federal (mês atual e próximo)
        if: ${{ inputs.mes == '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/ingestao-receita.mjs --enviar
          # O próximo mês só existe quando a Receita publicar; a ausência não é erro.
          y=$(date +%Y); m=$(date +%-m)
          if [ "$m" -eq 12 ]; then y=$((y+1)); m=1; else m=$((m+1)); fi
          node scripts/ingestao-receita.mjs --ano "$y" --mes "$m" --enviar || echo "Mês $m/$y ainda não publicado."
